name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auth_ci
          POSTGRES_PASSWORD: ci-only-not-for-deployment
          POSTGRES_DB: auth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_ci -d auth_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://auth_ci:ci-only-not-for-deployment@127.0.0.1:5432/auth_ci
      JWT_SECRET: ci-only-signing-key-not-for-any-deployment
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests without live dependencies
        run: npm run test:unit

      - name: Deploy migrations to isolated CI database
        run: npm run prisma:migrate:deploy

      - name: Unit and real-store integration coverage
        run: npm run test:coverage

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Build API image
        run: docker build --target runtime -t auth-service:ci .

      - name: Build migration image
        run: docker build --target migrations -t auth-service:migrations-ci .
